name: dtek-outage
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dtek-outage
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dtek-blackout-client==0.2.1
      - run: python fetch.py
        env:
          DTEK_CITY: ${{ secrets.DTEK_CITY }}
          DTEK_STREET: ${{ secrets.DTEK_STREET }}
          DTEK_HOUSE: ${{ secrets.DTEK_HOUSE }}
      - name: Commit changes
        run: |
          git config user.name "dtek-bot"
          git config user.email "dtek-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update data" && git push)
