name: dtek-outage

on:
  schedule:
    # Зимой (UTC+2): 06:00 - 23:59 по Киеву; летом (UTC+3): 07:00 - 00:59 по Киеву
    - cron: "7,22,37,52 4-21 * * *"
    # Ночной интервал (раз в час)
    - cron: "7 22,23,0,1,2,3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dtek-outage
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install dtek-blackout-client==0.2.1

      - name: Fetch outage data
        env:
          DTEK_CITY: ${{ secrets.DTEK_CITY }}
          DTEK_STREET: ${{ secrets.DTEK_STREET }}
          DTEK_HOUSE: ${{ secrets.DTEK_HOUSE }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Fetch attempt $attempt..."
            if python fetch.py; then
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 20s..."
            sleep 20
          done
          exit 1

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "dtek-bot"
          git config user.email "dtek-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes in data/"
            exit 0
          fi
          git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
          git commit -m "update data"
          git push
